name: Docker Build Validation

on:
  push:
    branches: [main, phase-1/docker-foundation]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-password
          LLM_API_KEY=ci-placeholder
          LLM_BASE_URL=https://integrate.api.nvidia.com/v1
          LLM_MODEL_NAME=ci-model
          EOF

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build application images
        run: docker compose build --pull

      - name: Start infrastructure and applications
        run: docker compose up -d

      - name: Wait for health
        run: |
          for i in {1..30}; do
            if docker compose ps --format json | grep -q '"Health":"healthy"'; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify backend health through proxy
        run: curl --fail --retry 5 --retry-delay 2 http://localhost/health

      - name: Verify frontend through proxy
        run: curl --fail --retry 5 --retry-delay 2 http://localhost/

      - name: Shutdown
        if: always()
        run: docker compose down -v
