services:
  postgres:
    image: postgres:16-alpine
    container_name: nscie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nscie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nscie_password}
      POSTGRES_DB: ${POSTGRES_DB:-nscie_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nscie_user} -d ${POSTGRES_DB:-nscie_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: nscie_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nscie_backend
    ports:
      - "8001:8000" 
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nscie_user}:${POSTGRES_PASSWORD:-nscie_password}@postgres:5432/${POSTGRES_DB:-nscie_db}
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-dummy_key_if_missing}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-nvidia/nemotron-3.5-lightning-30b-a3b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker.batch_worker"]
    container_name: nscie_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nscie_user}:${POSTGRES_PASSWORD:-nscie_password}@postgres:5432/${POSTGRES_DB:-nscie_db}
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-dummy_key_if_missing}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-nvidia/nemotron-3.5-lightning-30b-a3b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nscie_frontend
    restart: unless-stopped
    environment:
      PORT: 3005
      NEXT_PUBLIC_API_URL: http://localhost:8888
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3005/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nscie_nginx
    restart: unless-stopped
    ports:
      - "${NSCIE_PORT:-8888}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
